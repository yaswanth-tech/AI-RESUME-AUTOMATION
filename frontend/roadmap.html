<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Roadmap | ASCEND</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/navbar.css">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #6366f1;
      --primary-soft: #eef2ff;
      --bg-page: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --success: #10b981;
      --success-soft: #ecfdf5;
      --warning: #f59e0b;
      --warning-soft: #fffbeb;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-page);
      color: var(--text-main);
      display: block; min-height: 100vh;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-greeting {
      font-size: 0.85rem;
      color: var(--text-main);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* MAIN CONTENT */
    .main {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: var(--bg-page); width: 100%;
    }

    .top-header {
      padding: 24px 36px;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-left h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    .header-left p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-secondary {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: white;
      color: var(--text-main);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .btn-primary {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary:hover {
      background: var(--primary-light);
    }

    .content-container {
      padding: 32px 36px;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* VELOCITY / OVERVIEW BANNER */
    .velocity-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 24px;
    }

    .velocity-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .velocity-status {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 99px;
    }

    .status-ontrack {
      background: var(--success-soft);
      color: var(--success);
    }

    .status-accel {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .velocity-progress-wrap {
      margin-top: 10px;
      width: 100%;
    }

    .progress-bar-bg {
      height: 10px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      border-radius: 99px;
      transition: width 0.4s ease;
      width: 0%;
    }

    .velocity-stats {
      display: flex;
      gap: 28px;
      text-align: right;
    }

    .stat-box .stat-num {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1;
    }

    .stat-box .stat-lbl {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* TRACK SWITCHER SELECT */
    .track-select {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: white;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    /* PHASES LIST */
    .phases-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .phase-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .phase-card.active-phase {
      border-color: #c7d2fe;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.08);
    }

    .phase-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #f1f5f9;
    }

    .phase-meta {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary);
    }

    .phase-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 4px;
    }

    .phase-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
      max-width: 650px;
      line-height: 1.45;
    }

    .phase-pill {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      text-transform: uppercase;
    }

    .pill-completed {
      background: var(--success-soft);
      color: var(--success);
    }

    .pill-inprogress {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .pill-upcoming {
      background: #f1f5f9;
      color: var(--text-muted);
    }

    /* TASK CHECKLIST */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 14px;
      background: #f8fafc;
      border: 1px solid #edf2f7;
      border-radius: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .task-item:hover {
      background: #f1f5f9;
      border-color: #e2e8f0;
    }

    .task-item.task-done {
      background: #fbfdff;
      border-color: #e2e8f0;
    }

    .task-item.task-done .task-title {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .task-checkbox {
      margin-top: 2px;
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary);
      flex-shrink: 0;
    }

    .task-content {
      flex: 1;
    }

    .task-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .task-week {
      font-size: 0.7rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .task-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .task-tag {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .tag-learn {
      background: #e0e7ff;
      color: #4338ca;
    }

    .tag-build {
      background: #dcfce7;
      color: #15803d;
    }

    .tag-prep {
      background: #fef3c7;
      color: #b45309;
    }

    .task-deliverable {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* OPPORTUNITY UNLOCK */
    .opp-unlock {
      margin-top: 16px;
      padding: 14px 18px;
      background: linear-gradient(135deg, #fef9c3, #fef08a);
      border: 1px solid #fde047;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .unlock-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .unlock-icon {
      font-size: 24px;
    }

    .unlock-text strong {
      font-size: 0.9rem;
      color: #854d0e;
    }

    .unlock-text p {
      font-size: 0.8rem;
      color: #a16207;
      margin-top: 2px;
    }

    .unlock-btn {
      padding: 6px 12px;
      border-radius: 6px;
      background: #854d0e;
      color: white;
      font-weight: 600;
      font-size: 12px;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .unlock-btn:hover {
      background: #713f12;
    }

    /* EMPTY / ONBOARDING STATE */
    .empty-state {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 32px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .empty-state h3 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .empty-state p {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 520px;
      line-height: 1.5;
    }

    .empty-actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* TOAST */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 860px) {
      .content-container {
        padding: 20px;
      }
      .velocity-card {
        grid-template-columns: 1fr;
      }
      .velocity-stats {
        text-align: left;
      }
    }
  </style>
  <link rel="stylesheet" href="css/app-theme.css">
</head>

<body>
<div id="app-navbar"></div>

<!-- MAIN VIEW -->
  <main class="main">
    <header class="top-header">
      <div class="header-left">
        <h1 id="roadmapTitle">Career Roadmap</h1>
        <p>
          <span>Target:</span>
          <strong id="targetRoleText">Loading...</strong>
          <span class="badge-pill" id="targetSemesterPill">Batch 2026</span>
        </p>
      </div>
      <div class="header-actions">
        <select id="trackSelect" class="track-select" onchange="switchTrack(this.value)">
          <option value="ai-ml-fast-track-2026">AI/ML Fast Track (2026)</option>
          <option value="full-stack-career-camp-2026">Full Stack Mastery (2026)</option>
          <option value="gsoc-2026-cracker">GSoC 2026 Cracker Protocol</option>
        </select>
        <button class="btn-secondary" onclick="location.href='roadmap_setup.html'">
          🔍 Career Diagnosis
        </button>
        <button class="btn-primary" onclick="location.href='dashboard.html'">
          View Dashboard
        </button>
      </div>
    </header>

    <div class="content-container">

      <!-- VELOCITY / OVERVIEW -->
      <section class="velocity-card">
        <div class="velocity-left">
          <div class="velocity-status">
            <span style="font-weight: 700; font-size: 1rem; color: var(--text-main);">Roadmap Velocity</span>
            <span class="status-indicator status-ontrack" id="statusBadge">● On Track</span>
          </div>
          <p style="font-size: 0.9rem; color: var(--text-muted);" id="velocitySubtitle">
            Complete tasks each week to maintain momentum and unlock placement opportunities.
          </p>
          <div class="velocity-progress-wrap">
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" id="overallProgressBar"></div>
            </div>
          </div>
        </div>
        <div class="velocity-stats">
          <div class="stat-box">
            <div class="stat-num" id="currentPhaseNum">1</div>
            <div class="stat-lbl">Active Phase</div>
          </div>
          <div class="stat-box">
            <div class="stat-num" id="completedTasksCount">0</div>
            <div class="stat-lbl">Tasks Done</div>
          </div>
          <div class="stat-box">
            <div class="stat-num" id="progressPercentNum">0%</div>
            <div class="stat-lbl">Completed</div>
          </div>
        </div>
      </section>

      <!-- ROADMAP VIEW CONTAINER -->
      <section id="roadmapContainer">
        <div style="text-align: center; padding: 60px; color: var(--text-muted);">
          Loading your personalized roadmap...
        </div>
      </section>

    </div>
  </main>

  <div id="toast">Progress saved!</div>

  <script src="js/userContext.js"></script>
  <script>
    let CURRENT_USER = null;
    let CURRENT_TEMPLATE_ID = 'ai-ml-fast-track-2026';
    let COMPLETED_TASKS = new Set();
    let TEMPLATE_DATA = null;

    // Toast helper
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Initialize Page
    async function init() {
      try {
        CURRENT_USER = await UserContext.fetchUser();
        await UserContext.injectUserIdentity();

        const userId = UserContext.getUserId();

        // 1. Check user diagnosis or existing progress
        let prescribedTemplate = 'ai-ml-fast-track-2026';
        if (userId) {
          try {
            const userRes = await UserContext.fetchWithAuth(`/api/user/${encodeURIComponent(userId)}`);
            const userData = await userRes.json();
            if (userData.success && userData.user) {
              const u = userData.user;
              if (u.studentProfile?.targetRole) {
                document.getElementById('targetRoleText').textContent = u.studentProfile.targetRole;
              }
              if (u.studentProfile?.semester) {
                document.getElementById('targetSemesterPill').textContent = `Semester ${u.studentProfile.semester}`;
              }
              if (u.diagnosisResult?.prescribedTemplate) {
                prescribedTemplate = u.diagnosisResult.prescribedTemplate;
              }
            }
          } catch (e) {
            if (!UserContext.isSessionExpired(e)) console.warn("Could not fetch user profile details:", e);
          }
        }

        CURRENT_TEMPLATE_ID = prescribedTemplate;
        const trackSelect = document.getElementById('trackSelect');
        if (trackSelect) trackSelect.value = CURRENT_TEMPLATE_ID;

        await loadRoadmap(CURRENT_TEMPLATE_ID);
      } catch (err) {
        if (UserContext.isSessionExpired(err)) return;
        console.error("Init Error:", err);
        await loadRoadmap('ai-ml-fast-track-2026');
      }
    }

    // Load Roadmap Template & User Progress
    async function loadRoadmap(templateId) {
      CURRENT_TEMPLATE_ID = templateId;
      const userId = UserContext.getUserId() || 'guest';
      const container = document.getElementById('roadmapContainer');

      try {
        // A. Load Template Data
        const res = await fetch(`/api/roadmaps/${encodeURIComponent(templateId)}`);
        const result = await res.json();

        if (!result.success || !result.data) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">🗺️</div>
              <h3>Roadmap Track Unavailable</h3>
              <p>We couldn't load this roadmap track right now. Please select another track or complete the Career Diagnosis.</p>
              <div class="empty-actions">
                <button class="btn-primary" onclick="switchTrack('ai-ml-fast-track-2026')">Load AI/ML Fast Track</button>
                <button class="btn-secondary" onclick="location.href='roadmap_setup.html'">Take Diagnosis</button>
              </div>
            </div>
          `;
          return;
        }

        TEMPLATE_DATA = result.data;

        // B. Fetch or Init User Progress
        try {
          const initRes = await fetch('/api/roadmaps/init', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, templateId })
          });
          const initData = await initRes.json();
          if (initData.success && initData.data?.completedTasks) {
            COMPLETED_TASKS = new Set(initData.data.completedTasks);
          }
        } catch (initErr) {
          console.warn("Could not fetch user progress from DB, starting clean:", initErr);
        }

        renderRoadmap();
      } catch (e) {
        console.error("Failed to load roadmap:", e);
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⚠️</div>
            <h3>Unable to Load Roadmap</h3>
            <p>Could not connect to the roadmap service. Please ensure the backend server is active.</p>
            <div class="empty-actions">
              <button class="btn-primary" onclick="loadRoadmap(CURRENT_TEMPLATE_ID)">Retry</button>
            </div>
          </div>
        `;
      }
    }

    // Render Template & Phases
    function renderRoadmap() {
      if (!TEMPLATE_DATA) return;

      const t = TEMPLATE_DATA;
      document.getElementById('roadmapTitle').textContent = t.title || 'Career Roadmap';
      if (document.getElementById('targetRoleText').textContent === 'Loading...') {
        document.getElementById('targetRoleText').textContent = t.title;
      }

      // Count total tasks & phase status
      let totalTasks = 0;
      let completedCount = 0;
      let activePhaseNumber = 1;

      t.phases.forEach((phase) => {
        const pTasks = phase.tasks || [];
        totalTasks += pTasks.length;
        const allDone = pTasks.length > 0 && pTasks.every(task => COMPLETED_TASKS.has(task.id));
        pTasks.forEach(task => {
          if (COMPLETED_TASKS.has(task.id)) completedCount++;
        });
        if (allDone && activePhaseNumber === phase.phaseNumber) {
          activePhaseNumber = phase.phaseNumber + 1;
        }
      });

      const percent = totalTasks > 0 ? Math.round((completedCount / totalTasks) * 100) : 0;

      // Update Overview Banner
      document.getElementById('currentPhaseNum').textContent = activePhaseNumber;
      document.getElementById('completedTasksCount').textContent = `${completedCount}/${totalTasks}`;
      document.getElementById('progressPercentNum').textContent = `${percent}%`;
      document.getElementById('overallProgressBar').style.width = `${percent}%`;

      const statusBadge = document.getElementById('statusBadge');
      if (percent >= 50) {
        statusBadge.className = 'status-indicator status-ontrack';
        statusBadge.textContent = '● High Velocity';
      } else if (completedCount > 0) {
        statusBadge.className = 'status-indicator status-ontrack';
        statusBadge.textContent = '● On Track';
      } else {
        statusBadge.className = 'status-indicator status-accel';
        statusBadge.textContent = '● Ready to Begin';
      }

      // Render Phases
      const container = document.getElementById('roadmapContainer');
      container.innerHTML = `
        <div class="phases-list">
          ${t.phases.map((phase) => {
            const pTasks = phase.tasks || [];
            const isPhaseDone = pTasks.length > 0 && pTasks.every(tk => COMPLETED_TASKS.has(tk.id));
            const isPhaseActive = phase.phaseNumber === activePhaseNumber;

            let pillClass = 'pill-upcoming';
            let pillText = 'Upcoming';
            if (isPhaseDone) {
              pillClass = 'pill-completed';
              pillText = '✓ Completed';
            } else if (isPhaseActive) {
              pillClass = 'pill-inprogress';
              pillText = 'Active Sprint';
            }

            return `
              <div class="phase-card ${isPhaseActive ? 'active-phase' : ''}">
                <div class="phase-header">
                  <div>
                    <div class="phase-meta">PHASE ${phase.phaseNumber} • ${phase.durationWeeks || 4} WEEKS</div>
                    <div class="phase-title">${phase.title}</div>
                    <p class="phase-desc">${phase.description || ''}</p>
                  </div>
                  <span class="phase-pill ${pillClass}">${pillText}</span>
                </div>

                <div class="task-list">
                  ${pTasks.map(task => {
                    const isChecked = COMPLETED_TASKS.has(task.id);
                    const tagClass = task.type === 'BUILD' ? 'tag-build' : (task.type === 'LEARN' ? 'tag-learn' : 'tag-prep');
                    return `
                      <div class="task-item ${isChecked ? 'task-done' : ''}" onclick="toggleTask('${task.id}', event)">
                        <input type="checkbox" class="task-checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask('${task.id}', event)">
                        <div class="task-content">
                          <div class="task-top">
                            <span class="task-week">Week ${task.weekNumber || 1}</span>
                            <span class="task-title">${task.title}</span>
                            <span class="task-tag ${tagClass}">${task.type || 'TASK'}</span>
                          </div>
                          <div class="task-deliverable">👉 Output: ${task.deliverable || 'Complete module deliverables.'}</div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>

                ${phase.opportunityUnlockId ? `
                  <div class="opp-unlock">
                    <div class="unlock-left">
                      <div class="unlock-icon">🔓</div>
                      <div class="unlock-text">
                        <strong>Placement Opportunity Unlock</strong>
                        <p>Completing Phase ${phase.phaseNumber} unlocks direct referrals for target industry roles.</p>
                      </div>
                    </div>
                    <button class="unlock-btn" onclick="location.href='opportunities.html'">View Opportunities &rarr;</button>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // Toggle Task Completion Live
    async function toggleTask(taskId, e) {
      if (e) e.preventDefault();

      const userId = UserContext.getUserId() || 'guest';
      const wasChecked = COMPLETED_TASKS.has(taskId);

      // Optimistic UI update
      if (wasChecked) {
        COMPLETED_TASKS.delete(taskId);
      } else {
        COMPLETED_TASKS.add(taskId);
      }
      renderRoadmap();

      showToast(wasChecked ? 'Task unmarked' : 'Task marked as completed! 🎉');

      // Backend sync
      try {
        const res = await fetch('/api/roadmaps/toggle-task', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId,
            templateId: CURRENT_TEMPLATE_ID,
            taskId
          })
        });
        const data = await res.json();
        if (data.success && data.completedTasks) {
          COMPLETED_TASKS = new Set(data.completedTasks);
          renderRoadmap();
        }
      } catch (err) {
        console.warn("Could not sync task with backend:", err);
      }
    }

    // Switch Tracks
    function switchTrack(templateId) {
      loadRoadmap(templateId);
    }

    // Run on load
    init();
  </script>
  <script src="js/navbar.js"></script>
</body>

</html>
